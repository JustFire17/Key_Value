services:
  api1:
    build: ./api
    environment:
      - REDIS_URL=redis://haproxy-redis:6379
      - RABBITMQ_URL=amqp://admin:admin@haproxy-rabbit:5672
      - INIT_QUEUES=true
    ports:
      - "3003:3000"
    restart: unless-stopped

  api2:
    build: ./api
    environment:
      - REDIS_URL=redis://haproxy-redis:6379
      - RABBITMQ_URL=amqp://admin:admin@haproxy-rabbit:5672
    ports:
      - "3002:3000"
    restart: unless-stopped

  consumer:
    build: ./consumer
    depends_on:
      - haproxy-rabbit
      - haproxy-crdb
    environment:
      - RABBITMQ_URL=amqp://admin:admin@haproxy-rabbit:5672
      - COCKROACH_URL=postgresql://root@haproxy-crdb:26260/defaultdb?sslmode=disable
    restart: unless-stopped

  redis1:
    image: redis:latest
    command: redis-server --appendonly yes

  redis2:
    image: redis:latest
    command: redis-server --appendonly yes --replicaof redis1 6379
    depends_on:
      - redis1

  rabbit1:
    image: rabbitmq:3-management
    hostname: rabbit1
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_ERLANG_COOKIE=secret_cookie
    ports:
      - "5673:5672"
      - "15673:15672"

  rabbit2:
    image: rabbitmq:3-management
    hostname: rabbit2
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_ERLANG_COOKIE=secret_cookie
    ports:
      - "5674:5672"
      - "15674:15672"
    depends_on:
      - rabbit1
    command: >
      sh -c 'rabbitmq-server -detached && sleep 10 && rabbitmqctl stop_app && rabbitmqctl join_cluster rabbit@rabbit1 && rabbitmqctl start_app && tail -f /dev/null'

  rabbit3:
    image: rabbitmq:3-management
    hostname: rabbit3
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_ERLANG_COOKIE=secret_cookie
    ports:
      - "5675:5672"
      - "15675:15672"
    depends_on:
      - rabbit1
    command: >
      sh -c 'rabbitmq-server -detached && sleep 10 && rabbitmqctl stop_app && rabbitmqctl join_cluster rabbit@rabbit1 && rabbitmqctl start_app && tail -f /dev/null'

  haproxy:
    image: haproxy:2.9
    ports:
      - "8401:8401"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  haproxy-api:
    image: haproxy:2.9
    ports:
      - "3004:3001"
      - "8402:8402"
    volumes:
      - ./haproxy/haproxy-api.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2

  haproxy-rabbit:
    image: haproxy:2.9
    ports:
      - "5672:5672"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy-rabbitmq.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - rabbit1
      - rabbit2
      - rabbit3

  haproxy-redis:
    image: haproxy:2.9
    ports:
      - "6379:6379"
      - "8403:8403"
    volumes:
      - ./haproxy/haproxy-redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - redis1
      - redis2

  crdb1:
    image: cockroachdb/cockroach:v23.1.11
    command: start --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --advertise-addr=crdb1:26257 --join=crdb1,crdb2,crdb3
    hostname: crdb1
    container_name: crdb1
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - crdb1-data:/cockroach/cockroach-data

  crdb2:
    image: cockroachdb/cockroach:v23.1.11
    command: start --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --advertise-addr=crdb2:26257 --join=crdb1,crdb2,crdb3
    hostname: crdb2
    container_name: crdb2
    ports:
      - "26258:26257"
      - "8082:8080"
    volumes:
      - crdb2-data:/cockroach/cockroach-data

  crdb3:
    image: cockroachdb/cockroach:v23.1.11
    command: start --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --advertise-addr=crdb3:26257 --join=crdb1,crdb2,crdb3
    hostname: crdb3
    container_name: crdb3
    ports:
      - "26259:26257"
      - "8083:8080"
    volumes:
      - crdb3-data:/cockroach/cockroach-data

  haproxy-crdb:
    image: haproxy:2.9
    ports:
      - "26260:26257"
      - "8405:8405"
    volumes:
      - ./haproxy/haproxy-crdb.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - crdb1
      - crdb2
      - crdb3

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2 

volumes:
  crdb1-data:
  crdb2-data:
  crdb3-data: 