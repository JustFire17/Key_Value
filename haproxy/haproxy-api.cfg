global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend api
    bind *:3001
    default_backend api_nodes

backend api_nodes
    balance roundrobin
    option httpchk GET /health
    timeout check 10s
    server api1 api1:3000 check inter 3s fall 3 rise 2
    server api2 api2:3000 check inter 3s fall 3 rise 2

listen stats
    bind *:8402
    mode http
    stats enable
    stats uri /

