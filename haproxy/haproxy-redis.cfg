global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend redis
    bind *:6379
    default_backend redis_master

backend redis_master
    balance roundrobin
    option tcp-check
    server redis1 redis1:6379 check

listen stats
    bind *:8403
    mode http
    stats enable
    stats uri /

