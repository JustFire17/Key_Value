global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend crdb
    bind *:26260
    default_backend crdb_nodes

backend crdb_nodes
    balance roundrobin
    option tcp-check
    server crdb1 crdb1:26257 check
    server crdb2 crdb2:26257 check
    server crdb3 crdb3:26257 check

listen stats
    bind *:8405
    mode http
    stats enable
    stats uri /

